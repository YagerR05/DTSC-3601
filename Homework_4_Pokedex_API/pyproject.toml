[project]
name = "homework-4-pokedex-api"
version = "0.1.0"
description = "Pokedex ML API - Doppelganger (KNN stat similarity) pipeline served via FastAPI on Modal"
requires-python = ">=3.13"
dependencies = [
    "scikit-learn>=1.7,<1.8",
    "pandas>=2.2",
    "numpy>=2.0",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "modal>=1.5.4",
]

[tool.uv]
package = false
